name: Supabase Edge CI

# `supabase/**` altındaki değişikliklerde tetiklenir. Bu workflow olmadan
# edge function katmanı **hiç denetlenmiyordu**: 19 edge testi ve
# `deno check` yalnızca lokalde çalışıyordu, bir güvenlik düzeltmesi
# (ör. push şifreleme, hesap silme) regresyona uğrasa CI sessizce yeşil
# kalırdı. Flutter CI yalnızca Dart, React CI yalnızca `src/**` kapsıyordu.
#
# NOT (deneyim, 2026-09-28 → güncellendi): supabase CLI'nin Docker'ı bu
# ortamda **yok** (`psql`/`supabase` kurulu değil). Postgres 16'yı
# `docker exec ... psql` ile sıralı uygulama yöntemi A1r2/A1r3'te kullanıldı
# ve **gereksiz container + image indirme (dakikalar)** getiriyordu.
#
# ⭐ **Güncelleme (Tur 13, A6r13): `supabase start` GEREKMEDİĞİ kanıtlandı.**
# Bu dosya önceden "Migration/RLS testlerini CI'a almak `supabase start`
# gerektirir" diyordu; gerekçe **ölçümle çürütüldü** ve aşağıya `sql`
# job'u eklendi. Repo'nun Supabase'den ihtiyaç duyduğu yüzey ölçüldü:
# `auth.users`/`auth.uid()`/`auth.role()`, `storage.buckets`/
# `storage.objects`/`storage.foldername()` ve üç rol
# (`anon`/`authenticated`/`service_role`). Bunların tamamı
# `supabase/tests/auth_shim.sql` + `supabase/tests/storage_shim.sql` ile
# stock `postgres:16` üzerinde karşılanıyor; `cron`/`net`/`vault` için zaten
# `tests/a1r10_cron_shim.sql` vardı. `tool/run_sql_tests.sh` her şeyi
# sırayla kurar, 19 migration'ı + `full_setup.sql`'i (3× idempotans) uygular
# ve 5 SQL regresyon testini **ayrı ayrı, taze veritabanında** çalıştırır.
# TETİKLEME KAPSAMI (Tur 5 kararı — flutter.yml ile aynı gerekçe)
# `push` tüm branch'lere açık: `fix/...`/`tur5/...` gibi branch'lerde
# edge function değişikliği `deno check`/`deno test` kapısını atlıyordu.
# `paths` filtresi sayesinde `supabase/**` dışındaki değişiklikler
# tetiklemez.
# Kilit yolu `supabase/deno.lock`'dir (bkz. `supabase/deno.json` ve
# RAPOR-A6r9-denolock-tur10): `deno` calisma dizinine gore cozuyor, CI'da
# calisma dizini `supabase`. Onceki `deno.lock` (kok) tetiklemesi olu koddu —
# o dosya hicbir `deno` komutu tarafindan okunmuyordu.
on:
  push:
    paths:
      - "supabase/**"
      # `sql` job'ı `tool/run_sql_tests.sh`'i çalıştırıyor: shim'leri kuruyor,
      # migration'ları uyguluyor ve 5 SQL testini taze veritabanında
      # koşturuyor. Harness değişirse (örn. izolasyon kuralı) CI'nin
      # tetiklenmemesi, **güncellenmemiş bir test koşucusu** demektir.
      - "tool/run_sql_tests.sh"
      - ".github/workflows/supabase.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "tool/run_sql_tests.sh"
      - ".github/workflows/supabase.yml"

# Aynı branch için art arda tetiklenmelerde eski çalışmayı iptal et.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Lokal doğrulama ortamıyla birebir aynı sürüm (doğrulama 2026-09-28:
  # `deno --version` → deno 2.9.7 (stable)). Deno 2.x major'ı gerekir:
  # edge kodu `import type` + `satisfies` + `Uint8Array<ArrayBuffer>`
  # sözdizimini kullanıyor.
  #
  # Sürüm **iki yerde** sabitlenir: (a) .github/dependabot.yml'in
  # `denoland/setup-deno` güncellemesi action etiketiyle gelir, (b) aşağıdaki
  # `DENO_VERSION` eylem girdisi. `deno-version-file` (.tool-versions) veya
  # `deno-version` girdisinden hangisinin desteklendiği setup-deno@v2
  # README'sinden DOĞRULANDI (ikisi de destekleniyor); Dependabot'un
  # action'ı değil sürümü güncellediği için repo kökünde aslında ölü bir
  # dosya olurdu — bu yüzden `deno-version` girdisi seçildi.
  # NOT: Dependabot bu repoda **yok** (`.github/dependabot.yml` mevcut değil).
  # A6 alanında gerekçelendirilmiş bir dosya eklenecekse `setup-deno` için
  # `package-ecosystem: "github-actions"` kaydı doğru olan yerdir; sürüm
  # (`deno-version`) Dependabot tarafından güncellenmez, elle yükseltilir.
  DENO_VERSION: "2.9.7"

# Varsayılan `write-all` yerine sadece okuma (flutter.yml / react.yml ile aynı
# gerekçe: bu workflow hiçbir şey yazmıyor).
permissions:
  contents: read

jobs:
  edge:
    name: deno check + test
    runs-on: ubuntu-latest
    # Soğuk `DENO_DIR`'a uzak bağımlılık indirme (esm.sh, deno.land) en kötü
    # ağda 5-8 dk. 15 dakika bol; varsayılan 6 saat ağ takılmasında
    # boşa bekler.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: supabase
    steps:
      # Tüm eylemler 40 haneli commit SHA'sına pinlenir (flutter.yml ile aynı
      # gerekçe: etiket (`@v2`) hareketli bir referans).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Deno ${{ env.DENO_VERSION }}
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
          # `cache: true` varsayılan cache anahtarı `**/deno.lock` dosyasının
          # hash'ini kullanır. Kilit **`supabase/deno.lock`** (repoda takip
          # edilir): `supabase/deno.json` → `"lock": "deno.lock"` ve `deno` bu
          # yolu **çalışma dizinine göre** çözer, CI'da çalışma dizini
          # `supabase`. Glob `**/deno.lock` olduğu için konum ne olursa olsun
          # eşleşir; dosya repoda olduğu için `DENO_DIR` ilk çalışmadan itibaren
          # yeniden kullanılır.
          cache: true

      - name: Show toolchain
        run: deno --version

      # `deno check` TÜM fonksiyon + shared + test dosyalarını tip denetler.
      # 17 dosya temiz olmalı. `deno check` bir dizin kabul eder ve
      # `_test.ts` dosyalarını da kapsar (bunlar ayrıca `deno test` ile
      # koşar). Bu adım `deno test`'ten **önce** gelir: tip hatası derleme
      # aşamasında daha okunabilir bir mesaj verir ve test adımına
      # ulaşılmaz.
      #
      # `--frozen=true`: kilit güncel değilse CI **kırmızı** olur, kilit
      # sessizce yenilenmez. Ölçüldü (Tur 10): yeni bir uzak import eklendiğinde
      # "The lockfile is out of date" + exit 1. Ölçülen ikinci olgu: yalnızca
      # `deno check` çalıştırıldığında kilit **kısmi** kalıyor (25/36 remote),
      # `deno test` onu 36'ya tamamlıyordu — yani kilidi tazelemek için
      # `deno check`'e güvenmek yanıltıcıydı. Frozen kapısı bu yüzden **her iki**
      # adımda da açıktır.
      - name: Type check edge functions
        run: deno check --frozen=true functions/

      # 124 test. `--allow-env` gerekir: `rate_limit_test.ts` ve
      # `web_push_crypto_test.ts` `Deno.env.get` okur; `--allow-read` test
      # dosyalarının `index.ts` kaynağını okuduğu senkronizasyon testleri
      # için; `--allow-net` uzak bağımlılıkların (esm.sh) indirilmesi ve
      # WebCrypto tabanlı testler için. Aynı bayraklar lokalde kullanılan
      # komutla birebir aynıdır.
      #
      # `--frozen=true` gerekçesi yukarıda; ikinci adımda da kilit kısmi
      # kalmasın diye tekrarlanır (yoksa `deno test` onu sessizce tamamlardı
      # ve CI farkı görmezdi).
      - name: Test edge functions
        run: deno test --frozen=true --allow-env --allow-read --allow-net functions/

      # ⭐ Bu adım artık SQL'i **gerçekten doğruluyor** (aşağıdaki `sql` job).
      # Migration dosya adlarının sırası ve biçimi ucuz bir denetimle
      # denetlenir: Supabase migration'ları **kronolojik olarak** uygular
      # (şema geçmişi `history` tablosundaki sıraya göre), yani yanlış ad
      # = yanlış uygulama sırası.
      - name: Validate migration file names and order
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          migrations = pathlib.Path("migrations")
          files = sorted(p.name for p in migrations.glob("*.sql"))
          if not files:
              sys.exit("migrations/ altında .sql dosyası yok")
          pattern = re.compile(r"^\d{14}_[A-Za-z0-9][A-Za-z0-9_-]*\.sql$")
          bad = [f for f in files if not pattern.match(f)]
          if bad:
              sys.exit(f"geçersiz migration adı (YYYYMMDDHHMMSS_aciklama.sql bekleniyor): {bad}")
          stamps = [f[:14] for f in files]
          if stamps != sorted(stamps):
              sys.exit(f"migration zaman damgaları sıralı değil: {files}")
          dupes = {s for s in stamps if stamps.count(s) > 1}
          if dupes:
              sys.exit(f"yinelenen migration zaman damgası: {sorted(dupes)}")
          print(f"✓ {len(files)} migration adı geçerli ve kronolojik sıralı")
          PY

  # ===================================================================
  # `sql` job — migration + RLS + CHECK + cron regresyon testleri
  # ===================================================================
  # ⭐ A1r5 / A1r8 / A1r10 bu eksikliği **üç kez** raporladı:
  # "supabase/tests/*.sql CI'a bağlı değil". Üç tur boyunca gerekçe
  # "supabase CLI'nin Docker'ı yok, `supabase start` gerekiyor" idi.
  #
  # ### Ölçüm bu gerekçeyi çürüttü
  # Repo'daki SQL testlerinin ihtiyaç duyduğu Supabase yüzeyi **iki
  # şemadan** ibaret (ölçüldü: `grep -o "auth\.[a-zA-Z_.]*"` ve
  # `grep -o "storage\.[a-zA-Z_.]*"`):
  #
  #   - `auth.users` (yalnız `id`/`email`/`raw_user_meta_data`),
  #     `auth.uid()`, `auth.role()`
  #   - `storage.buckets`, `storage.objects`, `storage.foldername()`
  #   - `cron`/`net`/`vault` → zaten `tests/a1r10_cron_shim.sql` var
  #   - roller (`anon`/`authenticated`/`service_role`) → Supabase
  #     veritabanı kurulumunda yaratır, migration'lar değil
  #
  # Yani `supabase start` **gerekmiyor**: stock `postgres:16` + iki shim
  # yeterli. Shim'ler `supabase/tests/auth_shim.sql` ve
  # `supabase/tests/storage_shim.sql` — **test dosyası değil, koşul
  # sağlayıcı**, ikisi de `tool/run_sql_tests.sh` tarafından
  # migration'lardan **önce** yüklenir.
  #
  # ### Bu job neyi kanıtlıyor (yerelde ölçüldü, 2026-09-28)
  #   - 19 migration sıfırdan **0 hata**
  #   - `full_setup.sql` **3× üst üste 0 hata** (idempotans sözleşmesi)
  #   - `rls_policies.sql` → **49 test / 0 başarısız** (BOLA, WITH CHECK,
  #     `anon` erişimi, değişmez kolonlar)
  #   - `check_constraints.sql` → **58** pozitif/negatif yazma denemesi
  #   - `schema_contract.sql` → 16 tablo + 14 FK sahipliği + silme sırası
  #   - `foods_cascade.sql`, `account_deletion_scope.sql`,
  #     `cron_reminders_job.sql` → geçti
  #
  # ### ⭐ Negatif ölçüm (kapının gerçekten etkin olduğu kanıtlandı)
  # `foods.created_by` FK'si `ON DELETE CASCADE`'ten `SET NULL`'a
  # düşürüldü → **3 test kırmızıya döndü** ve `schema_contract` hatayı adıyla
  # söyledi: `[KALDI] foods.created_by ON DELETE CASCADE (3-A) -- confdeltype=n`.
  # Sonra geri alındı. Ayrıntı: RAPOR-A6r13.
  #
  # ### Bilinen kısıtlar (gizlenmiyor)
  #   - `pg_cron`/`pg_net` uzantıları stock imajda **yok**; migration'daki
  #     `CREATE EXTENSION` satırları harness'te yorum satırına çevrilir.
  #     Davranış `a1r10_cron_shim.sql` + `cron_reminders_job.sql` ile
  #     doğrulanıyor; **gerçek Zamanlayıcı tetiklemesi test edilemez**.
  #   - `auth` shimi GoTrue değildir: parola/oturum/OAuth yok. Testlerin
  #     konusu RLS ve FK zinciri olduğu için bu doğru soyutlamadır.
  #   - Storage shimi dosya **içeriği** saklamaz; politika ifadeleri
  #     (BOLA: klasör öneki ↔ `auth.uid()`) kanıtlanır.
  sql:
    name: migration + SQL regresyon testleri
    runs-on: ubuntu-latest
    # postgres:16 imajını çekme (~30 sn) + 19 migration + full_setup 3×
    # + 5 testin her biri için veritabanı klonu. Soğuk koşuda ölçüldü:
    # 4-5 dakika. 20 dakika bol.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # `postgres:16` sürümü `PG_IMAGE` ile sabitlenir. "latest" yazmak
      # major sürüm atlamasına yol açardı (16 → 17'de `confdeltype`
      # anlamı veya politika davranışı değişebilir).
      - name: Run SQL regression tests
        env:
          PG_IMAGE: "postgres:16"
        run: bash tool/run_sql_tests.sh
