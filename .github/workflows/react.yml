name: React CI

# `src/**` (React PWA, bakım modunda) altındaki değişikliklerde tetiklenir.
# Bu workflow olmadan React tarafında derleme kırılmaları (ör. TS5103
# "Invalid value for --ignoreDeprecations", A5'ın bulduğu ve tsc'nin
# hiç derlemediği hata) CI'da hiç yakalanmıyordu: `.github/workflows/`
# altında yalnızca `flutter.yml` vardı ve o da `paths: flutter_app/**`
# ile tetikleniyordu.
# TETİKLEME KAPSAMI (Tur 5 kararı — flutter.yml/supabase.yml ile aynı)
# `push` tüm branch'lere açık; `tool/**` ve `CHANGELOG.md` de eklendi,
# çünkü `check_versions.cjs`/`check_i18n.cjs` bu dosyaları okuyor.
on:
  push:
    paths:
      - "src/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.js"
      - "components.json"
      - "postcss.config.js"
      - "tailwind.config.ts"
      - "public/locales/**"
      - "tool/**"
      - "CHANGELOG.md"
      - ".github/workflows/react.yml"
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.js"
      - "components.json"
      - "postcss.config.js"
      - "tailwind.config.ts"
      - "public/locales/**"
      - "tool/**"
      - "CHANGELOG.md"
      - ".github/workflows/react.yml"

# Aynı branch için art arda tetiklenmelerde eski çalışmayı iptal et.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Vite 5 + ESLint 9 + TypeScript 5.8 bu major'ın üzerinde test edildi.
  # `npm ci` için `package-lock.json`'daki lockfile sürümü Node 20+ gerektirir
  # (npm 10+ üretir). Sabit major: sürüm kayması CI'ı kırmasın.
  NODE_VERSION: "20"

# Varsayılan `write-all` yerine sadece okuma. Bu workflow hiçbir şey
# yazmıyor (PR yorumu yok, issue açmıyor) ama default'ı daraltmak
# istismar yüzeyini kaldırır. `flutter.yml` ile aynı gerekçe.
permissions:
  contents: read

jobs:
  check:
    name: tsc + lint + build
    runs-on: ubuntu-latest
    # `npm ci` + build soğuk önbellekte 6-8 dk; ağ takılmasında runner'ın
    # 6 saatlik varsayılanı beklemek anlamına geliyor. 20 dakika bol.
    timeout-minutes: 20
    steps:
      # SHA'ya pinli: etiket (`@v4`) hareketli bir referans; tag sahibi
      # hesabı ele geçirilirse CI sessizce kötü kod çalıştırır. Dependabot
      # SHA'yı günceller, `# v4` yorumu sürümü okunur kılar.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` lock dosyasına **sadık** kurulum yapar ve `node_modules`
      # durumunu CI'da temiz tutar. `npm install` farklı bir ağaç kurup
      # `package-lock.json`'ı sessizce güncellerdi.
      - name: Install dependencies
        run: npm ci

      # A5'ın bulduğu asıl boşluk: `tsconfig.app.json` içindeki
      # `"ignoreDeprecations": "6.0"` TS 5.8.3'te TS5103 veriyor ve
      # tsc hiç derlemiyordu. `tsc -b` yerine `-p tsconfig.app.json`
      # kullanılır: repo kökündeki `tsconfig.json` solution-style referans
      # dosyası uygulama ayarlarını içermez.
      - name: Type check
        run: npx tsc -p tsconfig.app.json --noEmit

      # `eslint .` config'i `src/**` dışındaki dosyaları da gezer;
      # `--max-warnings` ile 0 hata + sınırlı uyarı kapısı kurulur. Repo
      # şu an 9 uyarı (shadcn/ui ve context dosyalarındaki
      # react-refresh/only-export-components) üretiyor; bu eşik mevcut
      # tabanı kırmadan yeni hataları yakalar.
      - name: Lint
        run: npm run lint -- --max-warnings 25

      # Mantık testleri (yedek içe aktarımı) + sürüm/sabit denetleyicileri.
      # `node --experimental-strip-types` Node 22.6+ gerektirir; CI'ın
      # NODE_VERSION'ı 20 olduğu için **Node 24** (yerleşik type-stripping
      # varsayılan) kullanılır. Bu adım olmadan `src/lib/import/**` hiç
      # çalıştırılmıyordu: 40 test yalnız geliştiricinin makinelerinde
      # koşuyordu ve yedek import sözleşmesi (ölümcül ihlalde hiç yazma
      # olmaması, `deleted_at` canlanmaması, epoch dedup, PGRST102) CI'da
      # doğrulanmıyordu.
      - name: Set up Node 24 (type-stripping for tests)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Test (backup import logic)
        run: npm test

      # `check_versions.cjs` iki istemcinin sabitlerini (makro oranları,
      # aktivite çarpanları, varsayılan hedefler) karşılaştırır; bu yüzden
      # `src/**` değişikliği Flutter sabitlerinden ayrışırsa da yakalar.
      - name: Check version consistency
        run: node tool/check_versions.cjs

      - name: Build
        run: npm run build
