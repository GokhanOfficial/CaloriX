name: Flutter CI

# `flutter_app/**` altındaki değişikliklerde (ve bu workflow'un kendisinde)
# tetiklenir. `tool/check_i18n.cjs` + `tool/check_versions.cjs` repo kökünden
# çalışır ve Flutter kodu + çevirileri okuduğu için `tool/**` ve
# `CHANGELOG.md` de path listesinde.
on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "flutter_app/**"
      - "tool/**"
      - "CHANGELOG.md"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "flutter_app/**"
      - "tool/**"
      - "CHANGELOG.md"
      - ".github/workflows/flutter.yml"

# Aynı branch için art arda tetiklenmelerde eski çalışmayı iptal et.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 3.47.x stable kanalında YAYIMLANDI (doğrulama 2026-09-27:
  # storage.googleapis.com/flutter_infra_release/releases_linux.json
  # → 3.47.0 2026-08-12 … 3.47.5 2026-09-18, current stable = 3.47.5).
  # Eski `3.47.0` sabiti CI'ı kırmıyordu ama 5 patch gerideydi; 3.47.5'e
  # sabitlendi. `flutter pub outdated` / `dart analyze` farkları patch'ler
  # arasında çıkabildiği için **majör.minör.yerel** (tam) sürüm sabit
  # tutulur, `channel: stable` sürümü yukarı taşımaz.
  FLUTTER_VERSION: "3.47.5"
  # build.gradle.kts (compileOptions VERSION_17) ile uyumlu.
  JAVA_VERSION: "17"
  # Node 20 = ubuntu-latest'in kendi Node'u ile uyumlu; i18n denetleyicisi
  # (tool/check_i18n.cjs) yalnızca Node gerektirir, bağımlılık kurmaz.
  NODE_VERSION: "20"

# Varsayılan `write-all` yerine sadece okuma. Bu workflow hiçbir şey
# yazmıyor (PR yorumu yok, issue açmıyor) ama default'ı daraltmak
# istismar yüzeyini kaldırır. CI hesabına `contents: read` yeterli:
# release işi `tool/release_android.sh` + `gh` ile lokalde çalışır.
permissions:
  contents: read

jobs:
  check:
    name: analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Resolve dependencies
        run: flutter pub get

      # `.env` gitignore'da ama pubspec.yaml'de asset olarak gömülü.
      # Build/test asset paketleme adımında dosyanın var olması gerekir;
      # yoksa "unable to find directory entry" ile build kırılır. CI'da
      # placeholder .env yaratıyoruz — gerçek değerler release işinde
      # `--dart-define` ile verilir (Env dart-define'a öncelik verir).
      - name: Synthesize placeholder .env (asset bundling)
        run: cp .env.example .env

      # Codegen: .g.dart dosyaları repoda committed olsa da, CI'da
      # güncel/çakışmasız üretildiklerini doğrular.
      - name: build_runner (codegen)
        run: dart run build_runner build --delete-conflicting-outputs

      # `analysis_options.yaml` strict-casts / strict-inference /
      # strict-raw-types + `always_declare_return_types`,
      # `prefer_single_quotes`, `unawaited_futures` açık. Repo şu an
      # "No issues found!" veriyor (0 error, 0 warning, 0 info) ve test
      # paketi de `prefer_single_quotes`'e uyuyor, bu yüzden uyarıları da
      # kapıya almak maliyetsiz: `--fatal-infos --fatal-warnings` yeni bir
      # lint uyarısı doğduğunda CI'ı kırar. (Tur 1'de 3 konuşma `test/**`
      # altındaydı; temizlendi.)
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test

      # `flutter analyze` ve `flutter test` yalnızca Dart kodunu doğrular.
      # `flutter_app/android/**` altındaki Kotlin (ana ekran widget'ları:
      # `kotlin/com/calorix/calorix/widget/`) ve XML kaynakları
      # (`res/layout/widget_*.xml`, `res/xml/widget_*_info.xml`,
      # `res/values/strings.xml`) **hiç** bu iki komutta denetlenmiyor —
      # widget commit'i (ec681c3) `analyze`'ı ve `test`'i olduğu gibi geçti.
      # Ölçüm (2026-09-27, bu makine, warm Gradle cache):
      #   flutter build apk --debug          → 33 sn
      #   ./gradlew :app:compileDebugKotlin   → 62 sn **ve BAŞARISIZ**
      #       (`:app:compileFlutterBuildDebug` bağımlı olduğu için Dart
      #        asset paketlemesini de tetikliyor, ayrıca Dart derleme
      #        hatasını maskeliyor; ayrı hedef avantaj sağlamıyor)
      # Bu yüzden `assembleDebug` seçildi: tek hem daha hızlı hem de
      # Kotlin + XML + resource merge + manifest birleştirmesinin tamamını
      # doğrular. CI'da `flutter-action` cache'i sayesinde ilk çalışma da
      # makul kalır.
      - name: Build Android debug APK (Kotlin + XML doğrulaması)
        run: flutter build apk --debug

      # XML kaynakları: `aapt2` derleme sırasında zaten doğruluyor, ama
      # layout/info XML'lerindeki `@string/...` referanslarının
      # `strings.xml`'de **tanımlı** olduğunu erken ve ucuz bir adımla
      # kontrol ediyoruz. Eksik referans `aapt2`'de daha geç (link aşamasında)
      # patlar ve hata mesajı daha az okunabilir.
      - name: Validate Android resource references
        run: |
          set -euo pipefail
          res=android/app/src/main/res
          strings="$res/values/strings.xml"
          missing=0
          for xml in $(find "$res" -name '*.xml'); do
            while IFS= read -r ref; do
              name="${ref#@string/}"
              if ! grep -q "name=\"$name\"" "$strings"; then
                echo "✗ $xml: tanımsız @string/$name"
                missing=$((missing + 1))
              fi
            done < <(grep -o '@string/[A-Za-z0-9_]*' "$xml" | sort -u)
          done
          if [ "$missing" -gt 0 ]; then
            echo "$missing tanımsız string referansı bulundu."
            exit 1
          fi
          echo "✓ tüm @string referansları tanımlı"

      # i18n bütünlüğü — 12 dilde eksik/fazla anahtar, boş değer ve
      # placeholder uyuşmazlığı ile "kodda kullanılan ama hiçbir dilde
      # karşılığı olmayan" anahtar kontrolü. Kaynak tabanı repo kökünde
      # olduğu için bu adım working-directory'yi geçici olarak köke alır.
      - name: Check i18n integrity
        working-directory: .
        run: node tool/check_i18n.cjs

      # pubspec.yaml / AppConstants.appVersion / CHANGELOG.md sürüm
      # kayması — kullanıcıya yanlış sürüm gösterilmesini yakalar.
      - name: Check version consistency
        working-directory: .
        run: node tool/check_versions.cjs

  build:
    name: build web + appbundle
    # Yalnızca main'e gittiğinde (push/PR merge) release build üret.
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Release build'de gerçek Supabase değerleri `--dart-define` ile
      # verilir (Env dart-define'a öncelik verir). .env yine de asset
      # paketlemesi için var olmalı.
      - name: Synthesize placeholder .env (asset bundling)
        run: cp .env.example .env

      - name: build_runner (codegen)
        run: dart run build_runner build --delete-conflicting-outputs

      # Secrets doğrudan `run:` kabuğuna gömülürse, değerde bir kabuk
      # metakarakteri ($, `, ", \) command injection'a dönüşür. Bunlar
      # env'e taşınır, kabuk genişletmesi yalnızca runner'ın kendi
      # değişkenlerine uygulanır.
      - name: Build web (release)
        env:
          SUPABASE_URL: ${{ secrets.FLUTTER_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.FLUTTER_SUPABASE_ANON_KEY }}
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: flutter_app/build/web
          if-no-files-found: error

      # CI'da imzalama yok (key.properties yok) → build.gradle.kts debug
      # signing'e düşer; build pipeline'ı yeşil kontrolü yeterli. Play
      # Console için gerçek imzalama ayrı, elle yapılır (Faz 5 dokümanı).
      - name: Build Android app bundle (release)
        env:
          SUPABASE_URL: ${{ secrets.FLUTTER_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.FLUTTER_SUPABASE_ANON_KEY }}
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: flutter-appbundle
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
