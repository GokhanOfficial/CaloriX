org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Bağımlılık indirmeleri aralıklı ağ kopmalarında dayanıklı olsun (2026-10-17):
# makinede bağlantı arada kesiliyor; artifact indirmesi bir TLS hatasında
# tüm build'i çökertiyordu. Gradle indirme yeniden denemelerini aç ve ilk
# zaman aşımını büyüt. (Not: `internal.*` bayrakları resmî olmayan Gradle
# özellikleridir; Gradle 9.3.1'de çalışıyor, ana sürümlerde davranış
# değişebilir — build yeniden kırılırsa buraya bak.)
org.gradle.internal.repository.max.retries=5
org.gradle.internal.repository.initial.timeout=60000
# Bu iki flag Flutter 3.47 şablonunun varsayılanlarıdır (template defaults).
# AGP 9.0 (org.jetbrains.kotlin.android plugin usage deprecated) + NDK
# (ANDROID_NDK_HOME removed) uyarıları buradan kaynaklanır: builtInKotlin=false
# iken flutter-gradle-plugin KGP'yi modüllere otomatik uygular → 13 modül için
# deprecation uyarısı (0 hata, non-fatal). builtInKotlin=true'ya geçmek plugin
# ekosistemi (camera_android_camerax / flutter_local_notifications)
# built-in Kotlin'e migrate edene kadar build'i kırabilir. Şablonda olduğu gibi
# bırakın; Flutter ve plugin sürümleri yükseldiğinde uyarılar kendiliğinden kaybolur.
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
