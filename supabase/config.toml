# Supabase CLI yerel yapılandırması.
# NOT: `project_id` kasıtlı olarak bu dosyada tutulur — bu bir SIR DEĞİLDİR,
# yalnızca proje tanımlayıcısıdır. Gerçek anahtarlar `.env` dosyasındadır ve
# `.gitignore` ile repoya girmez (`supabase/.env*` deseni: yalnızca `.env.example` izlenir).

project_id = "bzfnncensolirkqdohpq"

# ---------------------------------------------------------------------------
# Edge Function JWT doğrulaması
# ---------------------------------------------------------------------------
# `verify_jwt = true` YALNIZCA JWT imzasını ve süresini doğrular; oturumun
# iptal edilmiş/revoke edilmiş olup olmadığını kontrol etmez. Bu nedenle
# fonksiyonların kendi içinde `supabase.auth.getUser()` ile sunucu tarafı
# doğrulama yapması zorunludur (bkz. supabase/functions/_shared/auth.ts).
#
# ai-chat `config.toml` içinde BİLEREK tanımlı DEĞİL: bu dosyada listelenmeyen
# fonksiyonlar için Supabase varsayılanı devreye girer ve `verify_jwt` default
# olarak true'dur. Yine de açıkça yazılarak politika görünür kılınmıştır.
[functions.ai-chat]
verify_jwt = true

[functions.calculate-macros]
verify_jwt = true

[functions.recognize-food]
verify_jwt = true

[functions.recognize-food-text]
verify_jwt = true

# send-notification: hem kullanıcı JWT'si hem de dahili (cron) çağrı kabul eder.
# Dahili çağrı `x-calorix-internal-token` başlığı ile yetkilendirilir; token
# tanımlı değilse yalnızca service_role JWT'si geçerlidir.
# NOT: Supabase dashboard cron'u JWT'siz çağırır — üretimde mutlaka
# INTERNAL_FUNCTION_TOKEN secret'ı tanımlanmalıdır (bkz. .env.example).
[functions.send-notification]
verify_jwt = false

# check-reminders yalnızca sunucu içi (cron) çağrılmalıdır; anon JWT ile
# çağrılabilmesi tüm kullanıcı listesini dışarıya açardı (P0).
[functions.check-reminders]
verify_jwt = false

# delete-account (KVKK / Google Play "hesap silme" zorunluluğu).
# Kullanıcının KENDİ JWT'si ile çağrılır ve gövdedeki parola ile onaylanır.
# Bu bir cron DEĞİLDİR: INTERNAL_FUNCTION_TOKEN deseni **kullanılmaz**;
# fonksiyon kendi yetkilendirmesini (requireUserContext + parola) taşır.
#
# A1r4 denetimi: `verify_jwt = true` **doğru** ve `verify_jwt = false`
# YANLIŞ olurdu. Gerekçe:
#  - `false` olsaydı kapı yalnızca fonksiyon içindeki `requireUserContext`'e
#    kalırdı. O da `auth.getUser()` ile doğrulama yaptığı için *işlevsel*
#    olarak koruma sürerdi, ANCAK `requireUserContext` `Authorization` başlığı
#    yoksa `AuthError(401)` fırlatır — yani davranış aynı kalırdı. Buna
#    rağmen `true` doğrudur çünkü:
#    (a) JWT doğrulaması edge runtime'ın **önünde** (gateway'de) yapılır:
#        süresi dolmuş/imzasız jetonlar kullanıcı koduna hiç ulaşmaz →
#        daha az yüzey alanı, daha az kaynak tüketimi.
#    (b) Sahte `Authorization` başlığıyla gelen istekler kullanıcı kodunu ve
#        `service_client` oluşturma maliyetini hiç ödemez.
#    (c) Bu fonksiyon `service_role` **istemcisi** açıyor
#        (`requireUserContext(req, { serviceRole: true })`). Bu yetki
#        yalnızca fonksiyon içinde kullanılır ve kapsam doğrulanmış
#        `userId`'ye sabitlendikten sonra daraltılır; `verify_jwt = true`
#        bu zincirin ilk halkasıdır.
#  - YANLIŞ olabilecek tek yön, OTP/magic-link ya da parolasız (OAuth)
#    oturumlarda parola onayı çalışmazdı. Flutter istemcisinde **tek**
#    giriş yolu `signInWithPassword` (bkz.
#    flutter_app/lib/data/repositories/auth_repository.dart) olduğu için bu
#    risk bugün mevcut değil. OAuth eklenirse kısıt **yeniden
#    değerlendirilmelidir** (rapor: "Kalan riskler").
[functions.delete-account]
verify_jwt = true
