name: calorix-v2-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY}
    image: calorix-v2:prod
    container_name: calorix-v2-prod
    # `env_file` opsiyonel: repo'da .env.prod yok ve .dockerignore/.gitignore
    # ile git'ten dışlanıyor. VITE_* değerleri build-time gömüldüğü için
    # runtime'da ortam değişkenine gerek yok.
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    # Salt-okunur kök dosya sistemi + no-new-privileges (nginx yalnızca 8080'e
    # bağlanıyor, root olmadan çalışıyor).
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
