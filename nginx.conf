# CaloriX PWA — production statik sunucu.
# SPA fallback: her rota (client-side routing) index.html'e düşer.
# Gzip + uzun süreli immutable cache: Vite çıktısındaki /assets/* dosyaları
# içerik-hash'li dosya adı taşır, bu yüzden değişmez kabul edilebilirler.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Güvenlik başlıkları. CSP Vite/SWC çıktısı için gereksinimleri:
    #  - 'unsafe-inline' script: shadcn/ui + recharts gömülü <style> ve
    #    satır-içi stil kullanıyor; strict-dynamic yerine nonce üretmek React
    #    tarafında ek altyapı ister, bu yüzden burada minimum seviye tutuluyor.
    #  - connect-src: Supabase (kullanıcının VITE_SUPABASE_URL'i) + pollinations.
    #  - img-src: data: (AI beslenme görselleri) ve blob:.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.pollinations.ai; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Healthcheck ucu — Dockerfile HEALTHCHECK ve orchestration bunu kullanır.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Vite hash'li statik varlıklar
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # i18n çevirileri (i18next-http-backend bunları /locales/*'ten çeker)
    location /locales/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # SPA fallback — client-side routing için kritik.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
